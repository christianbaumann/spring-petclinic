<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="${error}"></span>
  </div>

  <h3 th:text="#{contactInfo}">Contact information</h3>
  <dl class="row" th:object="${owner}">
    <dt class="col-12 col-sm-3" th:text="#{name}">Name</dt>
    <dd class="col-12 col-sm-9"><b th:text="*{firstName + ' ' + lastName}"></b></dd>
    <dt class="col-12 col-sm-3" th:text="#{address}">Address</dt>
    <dd class="col-12 col-sm-9" th:text="*{address}"></dd>
    <dt class="col-12 col-sm-3" th:text="#{city}">City</dt>
    <dd class="col-12 col-sm-9" th:text="*{city}"></dd>
    <dt class="col-12 col-sm-3" th:text="#{telephone}">Telephone</dt>
    <dd class="col-12 col-sm-9" th:text="*{telephone}"></dd>
  </dl>

  <a th:href="@{__${owner.id}__/edit}" class="btn btn-primary mb-2" th:text="#{editOwner}">Edit
    Owner</a>
  <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary mb-2" th:text="#{addNewPet}">Add
    New Pet</a>

  <br />
  <br />
  <br />
  <h2 th:text="#{petsAndVisits}">Pets and Visits</h2>

  <div th:each="pet : ${owner.pets}" class="card mb-3">
    <div class="card-body">
      <h3 class="h5" th:text="#{petDetails}">Pet details</h3>
      <dl class="row">
        <dt class="col-5 col-sm-3" th:text="#{name}">Name</dt>
        <dd class="col-7 col-sm-9" th:text="${pet.name}"></dd>
        <dt class="col-5 col-sm-3" th:text="#{birthDate}">Birth Date</dt>
        <dd class="col-7 col-sm-9" th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></dd>
        <dt class="col-5 col-sm-3" th:text="#{type}">Type</dt>
        <dd class="col-7 col-sm-9" th:text="${pet.type}"></dd>
      </dl>
      <h4 class="h6" th:text="#{visitHistroy}">Visit history</h4>
      <div class="table-responsive">
        <table class="table table-sm">
          <thead>
            <tr>
              <th th:text="#{visitDate}">Visit Date</th>
              <th th:text="#{description}">Description</th>
            </tr>
          </thead>
          <tr th:each="visit : ${pet.visits}">
            <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
            <td th:text="${visit?.description}"></td>
          </tr>
        </table>
      </div>
      <a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" class="btn btn-sm btn-outline-primary" th:text="#{editPet}">Edit Pet</a>
      <a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" class="btn btn-sm btn-outline-primary" th:text="#{addVisit}">Add Visit</a>
    </div>
  </div>
  <script>
    // Function to hide the success and error messages after 3 seconds
    function hideMessages() {
      setTimeout(function () {
        document.getElementById("success-message").style.display = "none";
        document.getElementById("error-message").style.display = "none";
      }, 3000); // 3000 milliseconds (3 seconds)
    }

    // Call the function to hide messages
    hideMessages();
  </script>

</body>


</html>
